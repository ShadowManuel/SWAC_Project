# SIMS: alle Container für die lokale Entwicklung.
# Jeder Service trägt seine Container in seinem Setup-Task selbst ein (A1, B1, C1, D2).
# Vorlage für einen Service-Eintrag: der Service "simsapi" unten.
#
# Netze:
#   app        Frontend und die drei APIs
#   auth-db    nur auth-api und auth-db
#   ticket-db  nur ticket-api und ticket-db
#   log-db     nur logging-api und redis
# Datenbanken bekommen keinen "ports:"-Eintrag, sie sind nur im eigenen Netz erreichbar.

services:
  # Beispiel aus dem Unterricht, nur als Anhaltspunkt. Gehört nicht zum SIMS-System.
  simsapi:
    build:
      context: .
      dockerfile: src/simsapi/Dockerfile
    ports: ["5000:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # Scalar ist im Beispiel nur in Development aktiv
    networks: [app]

  ticket-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${TICKET_DB_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: 2048
    volumes: [ticket-db-data:/var/opt/mssql]
    networks: [ticket-db]

  ticketapi:
    build:
      context: .
      dockerfile: src/ticketapi/Dockerfile
    ports: ["5002:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TicketDb: "Server=ticket-db;Database=SimsTickets;User Id=sa;Password=${TICKET_DB_PASSWORD};TrustServerCertificate=True"
    networks: [app, ticket-db]
    depends_on: [ticket-db]
    restart: on-failure

networks:
  app:
  auth-db:
  ticket-db:
  log-db:

volumes:
  auth-db-data:
  ticket-db-data:
  redis-data:
