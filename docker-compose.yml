# SIMS: alle Container für die lokale Entwicklung.
# Jeder Service trägt seine Container in seinem Setup-Task selbst ein (A1, B1, C1, D2).
# Vorlage für einen Service-Eintrag: der Service "simsapi" unten.
#
# Netze:
#   app        Frontend und die drei APIs
#   auth-db    nur auth-api und auth-db
#   ticket-db  nur ticket-api und ticket-db
#   log-db     nur logging-api und redis
# Datenbanken bekommen keinen "ports:"-Eintrag, sie sind nur im eigenen Netz erreichbar.

services:
  # Beispiel aus dem Unterricht, nur als Anhaltspunkt. Gehört nicht zum SIMS-System.
  simsapi:
    build:
      context: .
      dockerfile: src/simsapi/Dockerfile
    ports: ["5000:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # Scalar ist im Beispiel nur in Development aktiv
    networks: [app]

  auth-api:
    build:
      context: .
      dockerfile: src/AuthApi/Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      LoggingService__BaseUrl: "http://logging-api:8080"
      ConnectionStrings__AuthDb: "Server=auth-db,1433;Database=SIMS_Auth;User Id=sa;Password=SimsUni2026!Test;Encrypt=True;TrustServerCertificate=True"
    depends_on:
      - auth-db
    networks:
      - app
      - auth-db

  auth-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "127.0.0.1:14330:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SimsUni2026!Test"
    volumes:
      - auth-db-data:/var/opt/mssql
    networks:
      - auth-db

  logging-api:
    build:
      context: .
      dockerfile: src/logging-service/Dockerfile
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LogDb: "mongodb://sims:${LOG_DB_PASSWORD:-ChangeMe_Log1}@log-db:27017/?authSource=admin"
    depends_on:
      - log-db
    networks:
      - app
      - log-db

  log-db:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: sims
      MONGO_INITDB_ROOT_PASSWORD: ${LOG_DB_PASSWORD:-ChangeMe_Log1}
    volumes:
      - log-db-data:/data/db
    networks:
      - log-db


  ticket-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${TICKET_DB_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: 2048
    volumes: [ticket-db-data:/var/opt/mssql]
    networks: [ticket-db]

  ticketapi:
    build:
      context: .
      dockerfile: src/ticketapi/Dockerfile
    ports: ["5002:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TicketDb: "Server=ticket-db;Database=SimsTickets;User Id=sa;Password=${TICKET_DB_PASSWORD};TrustServerCertificate=True"
    networks: [app, ticket-db]
    depends_on: [ticket-db]
    restart: on-failure

  web:
    build:
      context: ./src/web
    ports:
      - "8080:80"
    networks:
      - app

networks:
  app:
  auth-db:
  ticket-db:
  log-db:

volumes:
  auth-db-data:
  ticket-db-data:
  redis-data:
  log-db-data: