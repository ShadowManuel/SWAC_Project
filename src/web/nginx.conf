# SIMS Web: liefert die Seite aus und leitet API-Aufrufe an die Services weiter.
# Der Browser ruft nur http://localhost:8080 auf, deshalb ist kein CORS nötig.
# Die Service-Namen entsprechen der docker-compose.yml, Docker löst sie im Netz "app" auf.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker-DNS: Namen werden bei jeder Anfrage aufgelöst, nginx startet auch,
    # wenn ein Service noch nicht läuft.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /auth-api/ {
        set $upstream http://auth-api:8080;
        rewrite ^/auth-api/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /ticket-api/ {
        set $upstream http://ticketapi:8080;
        rewrite ^/ticket-api/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /logging-api/ {
        set $upstream http://logging-api:8080;
        rewrite ^/logging-api/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
